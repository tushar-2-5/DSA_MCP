services:
  - type: web
    name: recall-mcp
    runtime: python
    buildCommand: pip install uv && uv sync
    startCommand: uv run python -m server.main --transport streamable-http --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MCP_TRANSPORT
        value: streamable-http
