services:
  - type: web
    name: recall-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m server.main --transport sse --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
