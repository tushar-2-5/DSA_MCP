[project]
name = "recall"
version = "0.1.0"
description = "Recall - Persistent-memory MCP server for DSA practice using CockroachDB & AWS Bedrock"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "pydantic>=2.0.0",
    "boto3>=1.28.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
