name: Nightly Decay Handler
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  decay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run decay handler
        run: uv run python scripts/decay_handler.py
        env:
          PYTHONPATH: "."
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

