<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>

    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>

    <linearGradient id="cronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="0.5">
    Recall System Architecture
  </text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="500">
    Dual-Layer Memory & AI System for Developer DSA Practice
  </text>

  <!-- Subgraph 1: Clients -->
  <g transform="translate(50, 110)">
    <rect width="1100" height="110" rx="16" fill="url(#clientGrad)" stroke="#6366f1" stroke-width="1.5" opacity="0.9" />
    <text x="25" y="32" fill="#c7d2fe" font-size="16" font-weight="700">🖥️ CLIENT LAYER</text>

    <!-- Client 1 -->
    <rect x="50" y="45" width="300" height="50" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <text x="200" y="66" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Cursor / Claude Desktop</text>
    <text x="200" y="83" text-anchor="middle" fill="#818cf8" font-size="11">MCP stdio transport (JSON-RPC)</text>

    <!-- Client 2 -->
    <rect x="400" y="45" width="300" height="50" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <text x="550" y="66" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">VS Code Extension</text>
    <text x="550" y="83" text-anchor="middle" fill="#818cf8" font-size="11">Sidebar + Notifications (REST API)</text>

    <!-- Client 3 -->
    <rect x="750" y="45" width="300" height="50" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <text x="900" y="66" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Web Browser</text>
    <text x="900" y="83" text-anchor="middle" fill="#818cf8" font-size="11">Dashboard UI (HTTPS / Alpine.js)</text>
  </g>

  <!-- Connectors from Clients to Server -->
  <line x1="250" y1="220" x2="250" y2="260" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="600" y1="220" x2="600" y2="260" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="950" y1="220" x2="950" y2="260" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Subgraph 2: Railway Production Server -->
  <g transform="translate(50, 260)">
    <rect width="1100" height="110" rx="16" fill="url(#serverGrad)" stroke="#3b82f6" stroke-width="1.5" opacity="0.9" />
    <text x="25" y="32" fill="#bfdbfe" font-size="16" font-weight="700">🚀 RAILWAY PRODUCTION SERVER</text>

    <rect x="50" y="45" width="230" height="50" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1" />
    <text x="165" y="66" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">FastMCP Server</text>
    <text x="165" y="83" text-anchor="middle" fill="#60a5fa" font-size="11">8 MCP Registered Tools</text>

    <rect x="310" y="45" width="230" height="50" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1" />
    <text x="425" y="66" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">FastAPI Application</text>
    <text x="425" y="83" text-anchor="middle" fill="#60a5fa" font-size="11">REST Endpoints + Web Dashboard</text>

    <rect x="570" y="45" width="230" height="50" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1" />
    <text x="685" y="66" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Rate Limiter Middleware</text>
    <text x="685" y="83" text-anchor="middle" fill="#60a5fa" font-size="11">slowapi (10-60 req/min limits)</text>

    <rect x="830" y="45" width="220" height="50" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1" />
    <text x="940" y="66" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Structured Logger</text>
    <text x="940" y="83" text-anchor="middle" fill="#60a5fa" font-size="11">structlog JSON Renderer</text>
  </g>

  <!-- Connector to Tools -->
  <line x1="600" y1="370" x2="600" y2="410" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Subgraph 3: MCP Tools -->
  <g transform="translate(50, 410)">
    <rect width="1100" height="100" rx="16" fill="url(#toolGrad)" stroke="#22c55e" stroke-width="1.5" opacity="0.9" />
    <text x="25" y="30" fill="#bbf7d0" font-size="16" font-weight="700">🔧 MCP TOOLS (8 Core Operations)</text>

    <g transform="translate(30, 42)">
      <!-- Tool 1 -->
      <rect x="0" y="0" width="135" height="42" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
      <text x="67" y="25" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">get_or_create_user</text>

      <!-- Tool 2 -->
      <rect x="150" y="0" width="135" height="42" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
      <text x="217" y="25" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">get_mastery_report</text>

      <!-- Tool 3 -->
      <rect x="300" y="0" width="135" height="42" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
      <text x="367" y="25" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">log_attempt</text>

      <!-- Tool 4 -->
      <rect x="450" y="0" width="145" height="42" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
      <text x="522" y="25" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">suggest_next_problem</text>

      <!-- Tool 5 -->
      <rect x="610" y="0" width="145" height="42" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
      <text x="682" y="25" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">flag_recurring_mistake</text>

      <!-- Tool 6 -->
      <rect x="770" y="0" width="135" height="42" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
      <text x="837" y="25" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">get_problem_context</text>

      <!-- Tool 7 -->
      <rect x="920" y="0" width="120" height="42" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
      <text x="980" y="25" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">study_plan</text>
    </g>
  </g>

  <!-- Connectors to Data Layer and AI Layer -->
  <line x1="350" y1="510" x2="350" y2="560" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="850" y1="510" x2="850" y2="560" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Subgraph 4: Data Layer -->
  <g transform="translate(50, 560)">
    <rect width="680" height="290" rx="16" fill="url(#dataGrad)" stroke="#c084fc" stroke-width="1.5" opacity="0.9" />
    <text x="25" y="32" fill="#f5d0fe" font-size="16" font-weight="700">🗄️ DATA LAYER — CockroachDB Serverless</text>

    <!-- Table 1 -->
    <rect x="30" y="55" width="190" height="90" rx="10" fill="#2e1065" stroke="#e879f9" stroke-width="1" />
    <text x="125" y="85" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">users</text>
    <text x="125" y="108" text-anchor="middle" fill="#f0abfc" font-size="11">id, email, password_hash</text>
    <text x="125" y="125" text-anchor="middle" fill="#f0abfc" font-size="11">display_name, created_at</text>

    <!-- Table 2 -->
    <rect x="245" y="55" width="190" height="90" rx="10" fill="#2e1065" stroke="#e879f9" stroke-width="1" />
    <text x="340" y="85" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">problems</text>
    <text x="340" y="108" text-anchor="middle" fill="#f0abfc" font-size="11">3,359 Company Problems</text>
    <text x="340" y="125" text-anchor="middle" fill="#f0abfc" font-size="11">difficulty, topic, tags</text>

    <!-- Table 3 -->
    <rect x="460" y="55" width="190" height="90" rx="10" fill="#2e1065" stroke="#e879f9" stroke-width="1" />
    <text x="555" y="85" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">mastery</text>
    <text x="555" y="108" text-anchor="middle" fill="#f0abfc" font-size="11">14-Day Half-Life Decay</text>
    <text x="555" y="125" text-anchor="middle" fill="#f0abfc" font-size="11">base_score, last_practiced</text>

    <!-- Table 4 -->
    <rect x="30" y="165" width="190" height="90" rx="10" fill="#2e1065" stroke="#e879f9" stroke-width="1" />
    <text x="125" y="195" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">attempts</text>
    <text x="125" y="218" text-anchor="middle" fill="#f0abfc" font-size="11">user_id, problem_id</text>
    <text x="125" y="235" text-anchor="middle" fill="#f0abfc" font-size="11">outcome, time_spent</text>

    <!-- Table 5 -->
    <rect x="245" y="165" width="190" height="90" rx="10" fill="#2e1065" stroke="#e879f9" stroke-width="1" />
    <text x="340" y="195" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">mistakes</text>
    <text x="340" y="218" text-anchor="middle" fill="#f0abfc" font-size="11">mistake_type, description</text>
    <text x="340" y="235" text-anchor="middle" fill="#f0abfc" font-size="11">code_snippet, logged_at</text>

    <!-- Table 6 -->
    <rect x="460" y="165" width="190" height="90" rx="10" fill="#2e1065" stroke="#e879f9" stroke-width="1" />
    <text x="555" y="195" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">embeddings</text>
    <text x="555" y="218" text-anchor="middle" fill="#f0abfc" font-size="11">768-Dim Vector Float Arrays</text>
    <text x="555" y="235" text-anchor="middle" fill="#f0abfc" font-size="11">HNSW Cosine Similarity</text>
  </g>

  <!-- Subgraph 5: AI Layer -->
  <g transform="translate(760, 560)">
    <rect width="390" height="175" rx="16" fill="url(#aiGrad)" stroke="#f43f5e" stroke-width="1.5" opacity="0.9" />
    <text x="25" y="32" fill="#fecdd3" font-size="16" font-weight="700">🤖 AI VECTOR ENGINE</text>

    <rect x="30" y="55" width="330" height="45" rx="10" fill="#4c0519" stroke="#fb7185" stroke-width="1" />
    <text x="195" y="74" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Google Gemini API</text>
    <text x="195" y="90" text-anchor="middle" fill="#fda4af" font-size="11">text-embedding-004 (768 Dimensions)</text>

    <rect x="30" y="112" width="330" height="45" rx="10" fill="#4c0519" stroke="#fb7185" stroke-width="1" />
    <text x="195" y="131" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Vector Search Index</text>
    <text x="195" y="147" text-anchor="middle" fill="#fda4af" font-size="11">Cosine Distance Matching &amp; Clustering</text>
  </g>

  <!-- Subgraph 6: Automation -->
  <g transform="translate(760, 755)">
    <rect width="390" height="95" rx="16" fill="url(#cronGrad)" stroke="#f97316" stroke-width="1.5" opacity="0.9" />
    <text x="25" y="30" fill="#ffedd5" font-size="15" font-weight="700">⚙️ AUTOMATION — Decay Cron</text>

    <rect x="30" y="42" width="330" height="40" rx="8" fill="#431407" stroke="#fb923c" stroke-width="1" />
    <text x="195" y="60" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">GitHub Actions Cron (0 0 * * *)</text>
    <text x="195" y="75" text-anchor="middle" fill="#fdba74" font-size="10">Runs scripts/decay_handler.py Nightly</text>
  </g>
</svg>
