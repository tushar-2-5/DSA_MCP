<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900 text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recall — Persistent Memory for DSA Practice{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Marked.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="h-full flex flex-col bg-gray-900 text-gray-100 antialiased" x-data="{ user: {{ user | tojson if user else 'null' }} }">

    <!-- Navigation Header -->
    <header class="border-b border-gray-800 bg-gray-950/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <a href="/" class="flex items-center space-x-3 text-xl font-bold tracking-tight text-white">
                    <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <span>Recall<span class="text-indigo-400">.ai</span></span>
                </a>
                
                {% if user %}
                <nav class="hidden md:flex space-x-1">
                    <a href="/dashboard" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-gray-800 {% if request.url.path == '/dashboard' %}bg-gray-800 text-indigo-400{% else %}text-gray-300{% endif %}">
                        Dashboard
                    </a>
                    <a href="/problems" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-gray-800 {% if request.url.path == '/problems' %}bg-gray-800 text-indigo-400{% else %}text-gray-300{% endif %}">
                        Problems
                    </a>
                    <a href="/progress" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-gray-800 {% if request.url.path == '/progress' %}bg-gray-800 text-indigo-400{% else %}text-gray-300{% endif %}">
                        Progress & Analytics
                    </a>
                    <a href="/history" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-gray-800 {% if request.url.path == '/history' %}bg-gray-800 text-indigo-400{% else %}text-gray-300{% endif %}">
                        History
                    </a>
                </nav>
                {% endif %}
            </div>

            <div class="flex items-center space-x-4">
                {% if user %}
                <div class="flex items-center space-x-3">
                    <span x-data="{streak: 0}" 
                          x-init="fetch('/api/streak', { credentials: 'same-origin' }).then(r=>r.json()).then(d=>streak=d.current_streak)"
                          x-show="streak > 0"
                          class="text-xs bg-orange-500/20 text-orange-400 px-2 py-1 rounded-full">
                      🔥 <span x-text="streak"></span>
                    </span>
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-medium text-white">{{ user.display_name }}</div>
                        <div class="text-xs text-gray-400">{{ user.email }}</div>
                    </div>
                    <a href="/logout" class="px-3 py-1.5 rounded-lg border border-gray-700 text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition">
                        Sign Out
                    </a>
                </div>
                {% else %}
                <a href="/?action=login" class="px-4 py-2 text-sm font-medium text-gray-300 hover:text-white transition">
                    Sign In
                </a>
                <a href="/?action=signup" class="px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 transition">
                    Get Started
                </a>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Body Content -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-20 pb-10">
      <div class="flex flex-col items-center gap-3">
        
        <!-- Divider -->
        <div class="w-24 h-px bg-gradient-to-r from-transparent via-purple-500 to-transparent"></div>
        
        <!-- Main credit line -->
        <div class="flex items-center gap-3">
          <span class="text-gray-600 text-xs tracking-widest uppercase"
                style="font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.2em;">
            crafted by
          </span>
          <a href="https://www.linkedin.com/in/tushar-25tushar/"
             target="_blank"
             rel="noopener noreferrer"
             class="group relative">
            <!-- Glow effect on hover -->
            <span class="absolute inset-0 bg-purple-500/20 blur-lg rounded-full 
                         opacity-0 group-hover:opacity-100 transition-opacity duration-500"></span>
            <!-- Name with Pacifico font -->
            <span class="relative text-transparent bg-clip-text 
                         bg-gradient-to-r from-purple-400 via-pink-400 to-purple-400
                         text-xl font-bold group-hover:from-purple-300 
                         group-hover:via-pink-300 group-hover:to-purple-300
                         transition-all duration-300"
                  style="font-family: 'Pacifico', cursive;">
              Tushar
            </span>
          </a>
          <!-- LinkedIn icon -->
          <a href="https://www.linkedin.com/in/tushar-25tushar/"
             target="_blank"
             rel="noopener noreferrer"
             class="text-gray-600 hover:text-blue-400 transition-colors duration-200">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 
                       0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 
                       1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 
                       7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 
                       1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 
                       13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 
                       1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 
                       24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </a>
        </div>

        <!-- Tech stack pills -->
        <div class="flex items-center gap-2 mt-1">
          <span class="text-[10px] px-2 py-0.5 rounded-full border border-blue-500/30 
                       text-blue-400/70 bg-blue-500/5"
                style="font-family: 'Space Grotesk', sans-serif;">
            CockroachDB
          </span>
          <span class="text-gray-700">·</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full border border-green-500/30 
                       text-green-400/70 bg-green-500/5"
                style="font-family: 'Space Grotesk', sans-serif;">
            Gemini
          </span>
          <span class="text-gray-700">·</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full border border-purple-500/30 
                       text-purple-400/70 bg-purple-500/5"
                style="font-family: 'Space Grotesk', sans-serif;">
            FastMCP
          </span>
        </div>

      </div>
    </footer>

</body>
</html>
