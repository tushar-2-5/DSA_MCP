{% extends "base.html" %}

{% block title %}Problems — Recall{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8"
     x-data="{
        problems: [],
        loading: true,
        searchQuery: '',
        selectedTopic: 'all',
        selectedDifficulty: 'all',
        selectedPriority: 'all',
        
        // Modal state
        showModal: false,
        logForm: {
            problem_id: '',
            problem_title: '',
            outcome: 'pass',
            complexity_achieved: 'O(N)',
            time_taken_minutes: 20,
            mistake_summary: '',
            mistake_category: 'logic_error'
        },
        submitting: false,
        toastMessage: '',

        async init() {
            await this.fetchProblems();
        },

        async fetchProblems() {
            this.loading = true;
            try {
                const params = new URLSearchParams();
                if (this.selectedTopic !== 'all') params.append('topic', this.selectedTopic);
                if (this.selectedDifficulty !== 'all') params.append('difficulty', this.selectedDifficulty);
                if (this.searchQuery.trim()) params.append('search', this.searchQuery.trim());

                const res = await fetch(`/api/problems?${params.toString()}`);
                if (res.ok) {
                    const data = await res.json();
                    this.problems = data.problems || [];
                }
            } catch (e) {
                console.error(e);
            } finally {
                this.loading = false;
            }
        },

        get filteredProblems() {
            return this.problems.filter(p => {
                if (this.selectedPriority !== 'all' && (p.study_priority || 'medium').toLowerCase() !== this.selectedPriority.toLowerCase()) {
                    return false;
                }
                return true;
            });
        },

        openLogModal(p) {
            this.logForm.problem_id = p.id;
            this.logForm.problem_title = p.title;
            this.logForm.outcome = 'pass';
            this.logForm.complexity_achieved = 'O(N)';
            this.logForm.time_taken_minutes = 20;
            this.logForm.mistake_summary = '';
            this.logForm.mistake_category = 'logic_error';
            this.showModal = true;
        },

        async submitLog() {
            this.submitting = true;
            try {
                const res = await fetch('/api/log-attempt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.logForm)
                });
                if (res.ok) {
                    const data = await res.json();
                    this.showModal = false;
                    this.toastMessage = `Attempt logged for '${this.logForm.problem_title}'! Updated mastery: ${Math.round(data.mastery_score_after * 100)}%`;
                    setTimeout(() => this.toastMessage = '', 4000);
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to log attempt.');
                }
            } catch (e) {
                console.error(e);
                alert('Error submitting log.');
            } finally {
                this.submitting = false;
            }
        }
     }">

    <!-- Toast Notification -->
    <div x-show="toastMessage" x-cloak class="fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl bg-emerald-600 text-white font-semibold shadow-2xl flex items-center space-x-3 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span x-text="toastMessage"></span>
    </div>

    <!-- Page Header -->
    <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">DSA Problem Database</h1>
            <p class="text-gray-400 text-sm mt-1">Browse 200+ curated problems, filter by difficulty, and log your practice.</p>
        </div>
        <div class="text-xs font-semibold text-gray-400 bg-gray-950/60 px-4 py-2 rounded-xl border border-gray-800">
            Showing <span class="text-indigo-400 font-bold" x-text="filteredProblems.length"></span> problems
        </div>
    </div>

    <!-- Search & Filters Bar -->
    <div class="p-6 rounded-2xl bg-gray-950/60 border border-gray-800 mb-8 space-y-4 md:space-y-0 md:flex md:items-center md:space-x-4">
        <!-- Search Input -->
        <div class="flex-1 relative">
            <svg class="w-5 h-5 text-gray-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" x-model="searchQuery" @input.debounce.300ms="fetchProblems()" placeholder="Search problems by title..." class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-gray-900 border border-gray-800 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Topic Filter -->
        <div>
            <select x-model="selectedTopic" @change="fetchProblems()" class="w-full md:w-48 px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-800 text-white text-sm focus:outline-none focus:border-indigo-500">
                <option value="all">All Topics</option>
                <option value="arrays-hashing">Arrays & Hashing</option>
                <option value="two-pointers">Two Pointers</option>
                <option value="sliding-window">Sliding Window</option>
                <option value="stack">Stack</option>
                <option value="binary-search">Binary Search</option>
                <option value="linked-list">Linked List</option>
                <option value="trees">Trees</option>
                <option value="tries">Tries</option>
                <option value="backtracking">Backtracking</option>
                <option value="graphs">Graphs</option>
                <option value="1d-dynamic-programming">1D Dynamic Programming</option>
                <option value="2d-dynamic-programming">2D Dynamic Programming</option>
                <option value="greedy">Greedy</option>
                <option value="heap-priority-queue">Heap / Priority Queue</option>
                <option value="bit-manipulation">Bit Manipulation</option>
                <option value="math-geometry">Math & Geometry</option>
            </select>
        </div>

        <!-- Difficulty Filter -->
        <div>
            <select x-model="selectedDifficulty" @change="fetchProblems()" class="w-full md:w-40 px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-800 text-white text-sm focus:outline-none focus:border-indigo-500">
                <option value="all">All Difficulties</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </div>

        <!-- Priority Filter -->
        <div>
            <select x-model="selectedPriority" class="w-full md:w-40 px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-800 text-white text-sm focus:outline-none focus:border-indigo-500">
                <option value="all">All Priorities</option>
                <option value="high">High Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="low">Low Priority</option>
            </select>
        </div>
    </div>

    <!-- Problems Cards Grid -->
    <template x-if="loading">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="i in 6">
                <div class="p-6 rounded-2xl bg-gray-950/40 border border-gray-800 animate-pulse space-y-4">
                    <div class="h-5 bg-gray-800 rounded w-2/3"></div>
                    <div class="h-4 bg-gray-800 rounded w-1/3"></div>
                </div>
            </template>
        </div>
    </template>

    <template x-if="!loading && filteredProblems.length === 0">
        <div class="text-center py-16 bg-gray-950/40 border border-gray-800 rounded-3xl">
            <div class="text-gray-400 text-base mb-2">No problems match your current search/filters.</div>
            <button @click="searchQuery = ''; selectedTopic = 'all'; selectedDifficulty = 'all'; selectedPriority = 'all'; fetchProblems()" class="text-sm font-semibold text-indigo-400 hover:text-indigo-300">Reset Filters</button>
        </div>
    </template>

    <template x-if="!loading && filteredProblems.length > 0">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="p in filteredProblems" :key="p.id">
                <div class="p-6 rounded-2xl bg-gray-950/60 border border-gray-800 hover:border-indigo-500/40 transition flex flex-col justify-between group">
                    <div>
                        <!-- Header Badges -->
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold uppercase"
                                  :class="{
                                    'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30': p.difficulty === 'Easy',
                                    'bg-amber-500/20 text-amber-400 border border-amber-500/30': p.difficulty === 'Medium',
                                    'bg-rose-500/20 text-rose-400 border border-rose-500/30': p.difficulty === 'Hard'
                                  }"
                                  x-text="p.difficulty">
                            </span>
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-gray-800 text-gray-300 capitalize" x-text="p.topic_slug.replace(/-/g, ' ')"></span>
                        </div>

                        <!-- Title -->
                        <h3 class="font-bold text-white text-lg mb-2 group-hover:text-indigo-400 transition" x-text="p.title"></h3>
                        
                        <div class="flex items-center space-x-2 text-xs text-gray-400 mb-6">
                            <span>Study Priority:</span>
                            <span class="font-semibold text-indigo-300 uppercase" x-text="p.study_priority || 'Medium'"></span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="pt-4 border-t border-gray-900 flex items-center justify-between gap-3">
                        <a :href="p.url" target="_blank" class="text-xs font-semibold text-gray-400 hover:text-white transition flex items-center space-x-1">
                            <span>LeetCode</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                            </svg>
                        </a>
                        <button @click="openLogModal(p)" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-md shadow-indigo-600/20 transition">
                            Log Attempt
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <!-- Log Attempt Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div @click="showModal = false" class="fixed inset-0 bg-black/75 backdrop-blur-sm"></div>

        <div class="relative w-full max-w-lg p-8 bg-gray-900 border border-gray-800 rounded-3xl shadow-2xl z-10 space-y-5">
            <button @click="showModal = false" class="absolute top-5 right-5 text-gray-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>

            <h3 class="text-xl font-bold text-white">Log Solution Attempt</h3>
            <p class="text-xs text-gray-400" x-text="`Problem: ${logForm.problem_title}`"></p>

            <div class="grid grid-cols-3 gap-3">
                <button type="button" @click="logForm.outcome = 'pass'"
                        class="py-2.5 rounded-xl font-bold text-xs border transition"
                        :class="logForm.outcome === 'pass' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-gray-800 text-gray-400 border-gray-700'">
                    PASS
                </button>
                <button type="button" @click="logForm.outcome = 'partial'"
                        class="py-2.5 rounded-xl font-bold text-xs border transition"
                        :class="logForm.outcome === 'partial' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-gray-800 text-gray-400 border-gray-700'">
                    PARTIAL
                </button>
                <button type="button" @click="logForm.outcome = 'fail'"
                        class="py-2.5 rounded-xl font-bold text-xs border transition"
                        :class="logForm.outcome === 'fail' ? 'bg-rose-500/20 text-rose-400 border-rose-500/50' : 'bg-gray-800 text-gray-400 border-gray-700'">
                    FAIL
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Complexity Achieved</label>
                    <input type="text" x-model="logForm.complexity_achieved" placeholder="e.g. O(N log N)" class="w-full px-4 py-2.5 rounded-xl bg-gray-800 border border-gray-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Time Taken (minutes)</label>
                    <input type="number" x-model="logForm.time_taken_minutes" min="1" class="w-full px-4 py-2.5 rounded-xl bg-gray-800 border border-gray-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <template x-if="logForm.outcome !== 'pass'">
                <div class="space-y-4 pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Mistake Category</label>
                        <select x-model="logForm.mistake_category" class="w-full px-4 py-2.5 rounded-xl bg-gray-800 border border-gray-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                            <option value="sliding_window_off_by_one">Sliding Window Off-By-One</option>
                            <option value="logic_error">Logic Error</option>
                            <option value="boundary_condition">Boundary Condition Error</option>
                            <option value="time_limit_exceeded">Time Limit Exceeded (TLE)</option>
                            <option value="syntax_error">Syntax / Implementation Error</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Mistake Summary</label>
                        <textarea x-model="logForm.mistake_summary" rows="2" placeholder="Brief notes on what went wrong..." class="w-full px-4 py-2 rounded-xl bg-gray-800 border border-gray-700 text-white text-sm focus:outline-none focus:border-indigo-500"></textarea>
                    </div>
                </div>
            </template>

            <div class="pt-3">
                <button @click="submitLog()" :disabled="submitting" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow-lg shadow-indigo-600/30 transition">
                    <span x-text="submitting ? 'Submitting...' : 'Save Attempt & Update Mastery'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
