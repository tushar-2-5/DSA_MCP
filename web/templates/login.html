{% extends "base.html" %}

{% block title %}Sign In — Recall{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[300px] bg-indigo-600/15 blur-[120px] rounded-full pointer-events-none"></div>

    <div class="max-w-md w-full space-y-8 p-8 rounded-3xl bg-gray-900/90 border border-gray-800 backdrop-blur-xl shadow-2xl relative z-10">
        <div>
            <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full border border-indigo-500/30 bg-indigo-500/10 text-xs font-semibold text-indigo-400 mb-4">
                <span>Welcome Back</span>
            </div>
            <h2 class="text-3xl font-extrabold text-white tracking-tight">Sign in to Recall</h2>
            <p class="mt-2 text-sm text-gray-400">Access your personalized DSA mastery decay engine.</p>
        </div>

        {% if error %}
        <div class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form class="space-y-6" action="/login" method="POST">
            <div>
                <label for="email" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email address</label>
                <input id="email" name="email" type="email" required placeholder="alex@recall.dev" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                <input id="password" name="password" type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold shadow-lg shadow-indigo-600/30 transition">
                    Sign In
                </button>
            </div>
        </form>

        <div class="text-center pt-4 border-t border-gray-800 text-sm text-gray-400">
            Don't have an account? 
            <a href="/signup" class="font-semibold text-indigo-400 hover:text-indigo-300 transition">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
